                  window._klOnsite.push([method].concat(o, [function(result){

  <style>
    :root {
      --brand-gold: #c9a227;
      --brand-gold-light: #e4cf83;
      --brand-gold-deep: #8d6a18;
      --brand-ink: #1b1914;
      --brand-charcoal: #1c1a15;
      --brand-paper: #f6f3eb;
      --brand-surface: #fffdf8;
      --brand-muted: #6d675b;
      --pink: var(--brand-gold);
      --purple: var(--brand-gold-light);
      --accent: linear-gradient(135deg, var(--brand-gold-deep), var(--brand-gold-light));
      --focus-ring: rgba(201, 162, 39, .22);
    }

    html { scroll-behavior: smooth; scroll-padding-top: 1rem; }
    body {
      font-family: 'Inter', sans-serif;
      background: #fcfbf7;
      color: var(--brand-ink);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .font-serif { font-family: 'Playfair Display', serif; letter-spacing: -.025em; }
    .accent-text {
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .88rem 1.3rem;
      border: 1px solid transparent;
      border-radius: .45rem;
      font-weight: 700;
      letter-spacing: .01em;
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(26, 22, 13, .16); }
    .btn-purple {
      background: var(--accent);
      color: #211a0b;
      border-color: rgba(141, 106, 24, .42);
    }
    .btn-purple:hover { color: #17130a; filter: brightness(.98); }
    .card {
      border-radius: .9rem;
      background: var(--brand-surface);
      border: 1px solid rgba(141, 106, 24, .16);
      box-shadow: 0 10px 28px rgba(35, 29, 15, .055);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(201, 162, 39, .42);
      box-shadow: 0 18px 38px rgba(35, 29, 15, .10);
    }
    .section { padding: 5.25rem 0; }

    /* Premium charcoal, warm ivory, and restrained gold brand system. */
    .bg-gray-900 { background-color: var(--brand-charcoal) !important; }
    .bg-white { background-color: var(--brand-surface) !important; }
    .border-yellow-600 { border-color: var(--brand-gold) !important; }
    .hero-eyebrow {
      background: rgba(201, 162, 39, .12) !important;
      border-color: rgba(228, 207, 131, .38) !important;
      color: #f5ebc7 !important;
      backdrop-filter: blur(8px);
    }
    #contact form {
      border-color: rgba(228, 207, 131, .22) !important;
      background: rgba(255, 253, 248, .075) !important;
      border-radius: .85rem;
    }
    .bg-gray-50 { background-color: var(--brand-paper) !important; }
    .text-gray-900 { color: var(--brand-ink) !important; }
    .text-gray-700 { color: #403b31 !important; }
    .text-gray-600 { color: #625c50 !important; }
    .text-gray-500 { color: #797264 !important; }
    .text-pink-500, .text-pink-600, .text-purple-600 { color: var(--brand-gold-deep) !important; }
    .text-pink-100 { color: #f5ebc7 !important; }
    .text-pink-200 { color: #e6d39a !important; }
    .text-pink-300 { color: var(--brand-gold-light) !important; }
    .bg-pink-100, .bg-purple-100 { background-color: #f2ecd9 !important; color: var(--brand-gold-deep) !important; }
    .border-pink-100 { border-color: rgba(201, 162, 39, .34) !important; }
    .ring-pink-100 { --tw-ring-color: rgba(201, 162, 39, .28) !important; }
    .hover\:text-pink-300:hover, .hover\:text-pink-200:hover { color: var(--brand-gold-light) !important; }
    .hover\:bg-pink-50:hover { background-color: #f2ecd9 !important; }

    #hero { isolation: isolate; position: relative; background: var(--brand-charcoal); }
    .hero-backdrop {
      position: absolute; inset: 0; z-index: 0; opacity: 1;
      background-color: #171611;
      background-size: cover;
      background-position: center 58%;
      background-repeat: no-repeat;
    }
    .hero-overlay {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(90deg, rgba(12, 11, 8, .22) 0%, rgba(12, 11, 8, .06) 55%, rgba(12, 11, 8, .02) 100%);
    }
    #hero .hero-copy { position: relative; z-index: 10; max-width: min(58%, 46rem); }
    #hero .hero-copy h1 { max-width: 12ch; }
    #hero .btn:not(.btn-purple) {
      color: var(--brand-ink);
      background: var(--brand-surface);
      border-color: rgba(228, 207, 131, .55);
    }
    #hero .btn:not(.btn-purple):hover { background: #f2ecd9 !important; }
    #hero nav a { text-decoration: none; text-underline-offset: .35rem; transition: color .2s ease; }
    #hero nav a:hover { color: var(--brand-gold-light); }

    @media (max-width: 760px) {
      #hero { min-height: auto; }
      #hero .hero-copy { max-width: 100%; }
      #hero .hero-copy h1 { max-width: 14ch; }
      .hero-backdrop { background-position: 62% center; }
      .hero-overlay { background: linear-gradient(90deg, rgba(12, 11, 8, .76), rgba(12, 11, 8, .38)); }
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--brand-gold) !important;
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring) !important;
    }
    .lead-form input:not([type="checkbox"]), .lead-form textarea, .lead-form select {
      border-radius: .55rem;
      border-color: #d9d3c4;
      background-color: #fffefa;

    }
    .lead-form input[type="checkbox"] { accent-color: var(--brand-gold-deep); }
    .form-status { min-height: 1.5rem; }
    button:disabled { opacity: .65; cursor: wait; transform: none; }
    a { text-underline-offset: .2em; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(201, 162, 39, .65);
      outline-offset: 3px;
    }
    ::selection { background: rgba(201, 162, 39, .28); color: var(--brand-ink); }

    @media (max-width: 640px) {
      .section { padding: 4rem 0; }
      .card:hover { transform: none; }
      #hero .font-serif { line-height: 1.12; }
    }

  <main id="section-root" aria-live="polite"></main>

  <script>
    const sectionManifest = [
      'hero',
      'partners',
      'solutions',
      'about-videos',
      'lead-magnet',
      'global-reach',
      'b2b-services',
      'why-us',
      'collections',
      'featured',
      'downloads',
      'case-studies',
      'distributor',
      'supplier',
      'testimonials',
      'events',
      'insights',
      'footer'
    ];

    const pushGtmEvent = (eventName, payload = {}) => {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: eventName, ...payload });
    };

    const trackKlaviyoLead = (form, formData) => {
      const email = formData.get('email');
      const list = form.dataset.klaviyoList;
      const tags = (form.dataset.klaviyoTags || '').split(',').map((tag) => tag.trim()).filter(Boolean);
      const properties = Object.fromEntries(formData.entries());
      const flow = form.dataset.klaviyoFlow;
      const leadScore = Number(form.dataset.leadScore || 0);
      const pipelineStage = form.dataset.pipelineStage || 'New Lead';
      const profile = { email, $email: email, list, tags, flow, lead_score: leadScore, pipeline_stage: pipelineStage, ...properties };
      const eventPayload = { list, tags, flow, lead_score: leadScore, pipeline_stage: pipelineStage, properties };

      if (window.klaviyo) {
        if (typeof window.klaviyo.identify === 'function') window.klaviyo.identify(profile);
        if (typeof window.klaviyo.track === 'function') window.klaviyo.track('Lead Captured', eventPayload);
        if (typeof window.klaviyo.push === 'function') {
          window.klaviyo.push(['identify', profile]);
          window.klaviyo.push(['track', 'Lead Captured', eventPayload]);
        }
      }

      document.dispatchEvent(new CustomEvent('UnitedSpiritsLeadCaptured', { detail: eventPayload }));
    };

    const bindConversionHooks = () => {
      document.querySelectorAll('.lead-form').forEach((form) => {
        if (form.dataset.bound === 'true') return;
        form.dataset.bound = 'true';

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const formData = new FormData(form);
          const status = form.querySelector('.form-status');
          const submitButton = form.querySelector('button[type="submit"]');
          const originalButtonText = submitButton ? submitButton.textContent : '';
          const gtmEvent = form.dataset.gtmEvent;
          const downloadUrl = form.dataset.download;

          // Download forms keep their existing download behaviour.
          if (downloadUrl) {
            trackKlaviyoLead(form, formData);
            if (gtmEvent) pushGtmEvent(gtmEvent, {
              klaviyo_list: form.dataset.klaviyoList,
              klaviyo_tags: form.dataset.klaviyoTags,
              lead_score: Number(form.dataset.leadScore || 0),
              flow: form.dataset.klaviyoFlow
            });
            if (status) status.textContent = 'Thanks — your details have been captured.';
            window.open(downloadUrl, '_blank', 'noopener');
            form.reset();
            return;
          }

          // Distributor and Supplier enquiries are reported as successful only
          // after the server confirms delivery to the configured services.
          const payload = Object.fromEntries(formData.entries());
          if (form.dataset.leadType) payload.type = form.dataset.leadType;
          if (submitButton) {
            submitButton.disabled = true;
            submitButton.setAttribute('aria-busy', 'true');
            submitButton.textContent = 'Submitting…';
          }
          if (status) status.textContent = 'Submitting your enquiry…';

          try {
            if (form.dataset.leadType) {
              const response = await fetch('/api/lead', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(payload),
                credentials: 'same-origin'
              });
              const result = await response.json().catch(() => ({}));
              if (!response.ok || result.ok !== true) {
                throw new Error(result.message || 'We could not submit your enquiry. Please try again or email info@unitedspiritshk.com.');
              }
            }

            trackKlaviyoLead(form, formData);
            if (gtmEvent) pushGtmEvent(gtmEvent, {
              lead_type: form.dataset.leadType || undefined,
              klaviyo_list: form.dataset.klaviyoList,
              klaviyo_tags: form.dataset.klaviyoTags,
              lead_score: Number(form.dataset.leadScore || 0),
              flow: form.dataset.klaviyoFlow
            });
            if (status) status.textContent = 'Thank you. Your enquiry has been sent to our team.';
            form.reset();
          } catch (error) {
            console.error('Lead form submission failed', error);
            if (status) status.textContent = error.message || 'Submission failed. Please email info@unitedspiritshk.com.';
          } finally {
            if (submitButton) {
              submitButton.disabled = false;
              submitButton.removeAttribute('aria-busy');
              submitButton.textContent = originalButtonText;
            }
          }
        });
      });

      document.querySelectorAll('a[data-event], button[data-event]').forEach((element) => {
        if (element.dataset.bound === 'true') return;
        element.dataset.bound = 'true';
        element.addEventListener('click', () => {
          const eventName = element.dataset.event || 'BrochureDownload';
          pushGtmEvent(eventName, {
            href: element.getAttribute('href') || '',
            lead_score: Number(element.dataset.leadScore || 0)
          });
          if (eventName === 'BrochureDownload') {
            pushGtmEvent('BrochureDownloadClick', { href: element.getAttribute('href') || '' });
          }
        });
      });
    };

    const sectionErrorMarkup = (section, message) => `
      <section class="section bg-white" data-section-error="${section}">
        <div class="mx-auto max-w-3xl px-6 text-center">
          <h2 class="font-serif text-3xl text-gray-900">United Spirits HK</h2>
          <p class="mt-4 text-gray-600">The ${section} section could not be loaded. Please refresh the page or contact info@unitedspiritshk.com.</p>
          <p class="mt-2 text-xs text-gray-400">${message}</p>
        </div>
      </section>`;

    const loadSection = async (section) => {
      const sectionUrl = new URL(`sections/${section}.html`, window.location.href);
      const response = await fetch(sectionUrl.href, { cache: 'no-cache' });
      if (!response.ok) throw new Error(`HTTP ${response.status} for ${sectionUrl.pathname}`);
      return response.text();
    };

    const loadSections = async () => {
      const root = document.getElementById('section-root');
      const fragments = await Promise.all(sectionManifest.map(async (section) => {
        try {
          return await loadSection(section);
        } catch (error) {
          console.error(`Unable to load ${section}.html`, error);
          return sectionErrorMarkup(section, error.message);
        }
      }));
      root.innerHTML = fragments.join('\n');
      bindConversionHooks();
    };

    document.addEventListener('DOMContentLoaded', loadSections);
  </script>
