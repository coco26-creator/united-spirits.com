  <main id="section-root" aria-live="polite"></main>

  <script>
    const sectionManifest = [
      'hero',
      'partners',
      'about',
      'solutions',
      'about-videos',
      'lead-magnet',
      'global-reach',
      'b2b-services',
      'why-us',
      'collections',
      'featured',
      'downloads',
      'case-studies',
      'distributor',
      'supplier',
      'testimonials',
      'events',
      'insights',
      'footer'
    ];

    const pushGtmEvent = (eventName, payload = {}) => {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: eventName, ...payload });
    };

    const trackKlaviyoLead = (form, formData) => {
      const email = formData.get('email');
      const list = form.dataset.klaviyoList;
      const tags = (form.dataset.klaviyoTags || '').split(',').map((tag) => tag.trim()).filter(Boolean);
      const properties = Object.fromEntries(formData.entries());
      const flow = form.dataset.klaviyoFlow;
      const leadScore = Number(form.dataset.leadScore || 0);
      const pipelineStage = form.dataset.pipelineStage || 'New Lead';
      const profile = { email, $email: email, list, tags, flow, lead_score: leadScore, pipeline_stage: pipelineStage, ...properties };
      const eventPayload = { list, tags, flow, lead_score: leadScore, pipeline_stage: pipelineStage, properties };

      if (window.klaviyo) {
        if (typeof window.klaviyo.identify === 'function') window.klaviyo.identify(profile);
        if (typeof window.klaviyo.track === 'function') window.klaviyo.track('Lead Captured', eventPayload);
        if (typeof window.klaviyo.push === 'function') {
          window.klaviyo.push(['identify', profile]);
          window.klaviyo.push(['track', 'Lead Captured', eventPayload]);
        }
      }

      document.dispatchEvent(new CustomEvent('UnitedSpiritsLeadCaptured', { detail: eventPayload }));
    };

    const bindConversionHooks = () => {
      document.querySelectorAll('.lead-form').forEach((form) => {
        if (form.dataset.bound === 'true') return;
        form.dataset.bound = 'true';

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const formData = new FormData(form);
          const status = form.querySelector('.form-status');
          const submitButton = form.querySelector('button[type="submit"]');
          const originalButtonText = submitButton ? submitButton.textContent : '';
          const gtmEvent = form.dataset.gtmEvent;
          const downloadUrl = form.dataset.download;

          // Download forms keep their existing download behaviour.
          if (downloadUrl) {
            trackKlaviyoLead(form, formData);
            if (gtmEvent) pushGtmEvent(gtmEvent, {
              klaviyo_list: form.dataset.klaviyoList,
              klaviyo_tags: form.dataset.klaviyoTags,
              lead_score: Number(form.dataset.leadScore || 0),
              flow: form.dataset.klaviyoFlow
            });
            if (status) status.textContent = 'Thanks — your details have been captured.';
            window.open(downloadUrl, '_blank', 'noopener');
            form.reset();
            return;
          }

          // Distributor and Supplier enquiries are reported as successful only
          // after the server confirms delivery to the configured services.
          const payload = Object.fromEntries(formData.entries());
          if (form.dataset.leadType) payload.type = form.dataset.leadType;
          if (submitButton) {
            submitButton.disabled = true;
            submitButton.setAttribute('aria-busy', 'true');
            submitButton.textContent = 'Submitting…';
          }
          if (status) status.textContent = 'Submitting your enquiry…';

          try {
            if (form.dataset.leadType) {
              const response = await fetch('/api/lead', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(payload),
                credentials: 'same-origin'
              });
              const result = await response.json().catch(() => ({}));
              if (!response.ok || result.ok !== true) {
                throw new Error(result.message || 'We could not submit your enquiry. Please try again or email info@unitedspiritshk.com.');
              }
            }

            trackKlaviyoLead(form, formData);
            if (gtmEvent) pushGtmEvent(gtmEvent, {
              lead_type: form.dataset.leadType || undefined,
              klaviyo_list: form.dataset.klaviyoList,
              klaviyo_tags: form.dataset.klaviyoTags,
              lead_score: Number(form.dataset.leadScore || 0),
              flow: form.dataset.klaviyoFlow
            });
            if (status) status.textContent = 'Thank you. Your enquiry has been sent to our team.';
            form.reset();
          } catch (error) {
            console.error('Lead form submission failed', error);
            if (status) status.textContent = error.message || 'Submission failed. Please email info@unitedspiritshk.com.';
          } finally {
            if (submitButton) {
              submitButton.disabled = false;
              submitButton.removeAttribute('aria-busy');
              submitButton.textContent = originalButtonText;
            }
          }
        });
      });

      document.querySelectorAll('a[data-event], button[data-event]').forEach((element) => {
        if (element.dataset.bound === 'true') return;
        element.dataset.bound = 'true';
        element.addEventListener('click', () => {
          const eventName = element.dataset.event || 'BrochureDownload';
          pushGtmEvent(eventName, {
            href: element.getAttribute('href') || '',
            lead_score: Number(element.dataset.leadScore || 0)
          });
          if (eventName === 'BrochureDownload') {
            pushGtmEvent('BrochureDownloadClick', { href: element.getAttribute('href') || '' });
          }
        });
      });
    };

    const sectionErrorMarkup = (section, message) => `
      <section class="section bg-white" data-section-error="${section}">
        <div class="mx-auto max-w-3xl px-6 text-center">
          <h2 class="font-serif text-3xl text-gray-900">United Spirits HK</h2>
          <p class="mt-4 text-gray-600">The ${section} section could not be loaded. Please refresh the page or contact info@unitedspiritshk.com.</p>
          <p class="mt-2 text-xs text-gray-400">${message}</p>
        </div>
      </section>`;

    const initGlobalFootprintMap = () => {
      const mapEl = document.getElementById('global-footprint-map');
      if (!mapEl || mapEl.dataset.initialized === 'true') return;

      const renderMap = () => {
        if (!window.L || !mapEl.isConnected || mapEl.dataset.initialized === 'true') return;
        mapEl.dataset.initialized = 'true';
        const map = window.L.map(mapEl, {
          center: [20, 82],
          zoom: 2,
          scrollWheelZoom: false
        });
        window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 18
        }).addTo(map);

        const locations = [
          { name: 'Hong Kong — Global Hub', position: [22.281556, 114.1793047] },
          { name: 'Qingdao, China — Customisation Hub', position: [36.067108, 120.382609] },
          { name: 'Japan — Premium Focus', position: [36.2048, 138.2529] },
          { name: 'South Korea — Growing Demand', position: [35.9078, 127.7669] },
          { name: 'ASEAN — Regional Markets', position: [10.8, 106.7] },
          { name: 'Ghana — Africa Distribution', position: [7.9465, -1.0254] }
        ];

        locations.forEach((location) => {
          window.L.circleMarker(location.position, {
            radius: 8,
            fillColor: '#a88645',
            fillOpacity: 1,
            color: '#ffffff',
            weight: 2
          }).addTo(map).bindPopup('<strong>' + location.name + '</strong>');
        });
        window.setTimeout(() => map.invalidateSize(), 100);
      };

      if (window.L) {
        renderMap();
        return;
      }
      if (document.querySelector('script[data-leaflet-loader="true"]')) return;
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/leaflet@1.7.1/dist/leaflet.js';
      script.async = true;
      script.dataset.leafletLoader = 'true';
      script.onload = renderMap;
      script.onerror = () => {
        mapEl.textContent = 'Map unavailable. Our distribution network includes Hong Kong, China, Japan, South Korea, ASEAN, and Ghana.';
        mapEl.setAttribute('role', 'status');
      };
      document.head.appendChild(script);
    };

    const loadSection = async (section) => {
      const sectionUrl = new URL(`sections/${section}.html`, window.location.href);
      const response = await fetch(sectionUrl.href, { cache: 'no-cache' });
      if (!response.ok) throw new Error(`HTTP ${response.status} for ${sectionUrl.pathname}`);
      return response.text();
    };

    const loadSections = async () => {
      const root = document.getElementById('section-root');
      const fragments = await Promise.all(sectionManifest.map(async (section) => {
        try {
          return await loadSection(section);
        } catch (error) {
