<header class="fixed top-0 left-0 w-full flex items-center justify-between px-6 py-4 z-50 transition-all duration-300">
  <!-- Logo -->
  <a href="index.html" class="logo flex items-center gap-2" aria-label="U.S.C Home">
    <img src="assets/images/usc.png"
         class="logo-icon-img"
         style="height: 2.5rem; width: auto; visibility: visible;"
         alt="United Spirits Logo" />
    <span class="text-white font-semibold">U.S.C</span>
  </a>

  <!-- Desktop Nav -->
  <nav class="hidden md:flex items-center gap-8">
    <a href="#solutions" class="text-white hover:text-pink-300 transition-colors">Solutions</a>
    <a href="#case-studies" class="text-white hover:text-pink-300 transition-colors">Case Studies</a>
    <a href="blog.html" class="text-white hover:text-pink-300 transition-colors">Insights</a>
    <a href="#distributor" class="btn btn-purple py-2 px-6 text-sm">Join Network</a>
  </nav>

  <!-- Mobile Menu Button -->
  <button
    id="mobileMenuButton"
    class="md:hidden p-2 text-white"
    aria-label="Toggle menu"
    aria-expanded="false"
    aria-controls="mobileHeaderNav"
  >
    ☰
  </button>
  <nav id="mobileHeaderNav" class="hidden absolute top-full left-0 w-full bg-gray-900 border-t border-white/10 px-6 py-4 md:hidden" aria-label="Mobile navigation">
    <a href="index.html#collections" class="block py-3 text-white hover:text-pink-300">Collections</a>
    <a href="#solutions" class="block py-3 text-white hover:text-pink-300">Solutions</a>
    <a href="#case-studies" class="block py-3 text-white hover:text-pink-300">Case Studies</a>
    <a href="blog.html" class="block py-3 text-white hover:text-pink-300">Insights</a>
    <a href="#distributor" class="block py-3 text-white hover:text-pink-300">Join Network</a>
  </nav>
</header>

<script>
  // Quick script for mobile menu in component
  (function() {
    const btn = document.getElementById('mobileMenuButton');
    const header = document.querySelector('header');
    const mobileNav = document.getElementById('mobileHeaderNav');
    if (btn && mobileNav) {
      btn.addEventListener('click', () => {
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!expanded));
        mobileNav.classList.toggle('hidden', expanded);
      });
      mobileNav.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => {
        mobileNav.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
      }));
    }
    
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        header.classList.add('scrolled', 'bg-white/80', 'backdrop-blur-md', 'shadow-sm');
        header.querySelectorAll('.text-white').forEach(el => el.classList.replace('text-white', 'text-black'));
      } else {
        header.classList.remove('scrolled', 'bg-white/80', 'backdrop-blur-md', 'shadow-sm');
        header.querySelectorAll('.text-black').forEach(el => el.classList.replace('text-black', 'text-white'));
      }
    });
  })();
</script>
